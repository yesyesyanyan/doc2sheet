name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  # Deploys the demo to Hugging Face after tests pass on main.
  # Enable it by adding a repo variable HF_SPACE (e.g. yourname/doc2sheet)
  # and a repo secret HF_TOKEN with write access.
  deploy-space:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub
      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/deploy_space.py --space "${{ vars.HF_SPACE }}" --github-url "https://github.com/${{ github.repository }}"
